<!DOCTYPE html>
<html lang="ja">

<head>
        <meta charset="UTF-8">
        <title>ポケモンダメージ計算</title>
        <style>
                body {
                        font-family: sans-serif;
                        text-align: center;
                        padding: 20px;
                }

                .nature-cell {
                        padding: 0;
                }

                .nature-cell label {
                        display: block;
                        padding: 10px;
                        cursor: pointer;
                }

                .nature-cell label:hover {
                        background-color: #f0f0f0;
                }

                /* 左右に並べるためのコンテナ */
                .calculator-container {
                        display: flex;
                        flex-wrap: wrap;
                        justify-content: center;
                        gap: 20px;
                        margin-top: 20px;
                }

                .move-side {
                        min-width: 300px;
                        padding: 15px;
                        background-color: #f9f9f9;
                        border: 1px solid #ddd;
                        border-radius: 8px;
                        text-align: left;
                }

                .player-side,
                .enemy-side {
                        min-width: 400px;
                        padding: 15px;
                        background-color: #f9f9f9;
                        border: 1px solid #ddd;
                        border-radius: 8px;
                        text-align: left;
                }

                .side-title {
                        font-size: 1.2em;
                        font-weight: bold;
                        margin-top: 0;
                        margin-bottom: 10px;
                        text-align: center;
                        padding: 5px;
                        background-color: #eee;
                        border-radius: 4px;
                }

                /* ポケモン名入力欄のサイズ調整 */
                .pokemon-name-input {
                        width: 100px;
                        padding: 2px;
                }

                .pokemon-ability-input {
                        width: 40px;
                        padding: 2px;
                }

                table {
                        margin: 0 auto;
                        border-collapse: collapse;
                }
        </style>
</head>

<body>

        <header>
                <nav>
                        <ul>
                                <li><a href="#home">ホーム</a></li>
                                <li><a href="#calc">計算機</a></li>
                        </ul>
                </nav>
                <a href="https://yakkun.com/tool/damage.htm" target="_blank">
                        ポケ徹のダメ計
                </a>
        </header>

        <main id="calc">

                                                <th>項目</th>

                                                <th>努力値</th>

                                                <th>実数値</th>

                                                                value="50"
                                                                oninput="syncValue('player', 'levelNum', this.value)">
                                                </td>
                                                <td><input type="number" id="levelNum" min="1" max="100" step="1"
                                                                value="50"
                                                                oninput="syncValue('player', 'levelRange', this.value)">
                                                </td>
                                                <td>努力値合計 : </td>
                                                <td><span id="totalEV">0</span> / 510</td>
                                                <td></td>
                                                <td></td>
                                        </tr>

                                                <td><label for="hpNum">H</label></td>

                                </tr>

                                </tr>
                                <tr>
                                        <td><label for="moveType">タイプ</label></td>

                                                <select id="moveType">

                                </tr>
                                <tr>

                                                                value="special">特殊</label>
                                        </td>
                                </tr>

                                        <tr>

                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"

                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="mild">おっとり</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="bashful">てれや</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="rash">うっかりや</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="quiet">れいせい</label></td>
                                        </tr>
                                        <tr>
                                                <th>D↑</th>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="calm">おだやか</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="gentle">おとなしい</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="careful">しんちょう</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="quirly">きまぐれ</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="sassy">なまいき</label></td>
                                        </tr>
                                        <tr>
                                                <th>S↑</th>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="timid">おくびょう</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="hasty">せっかち</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="jolly">ようき</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="naive">むじゃき</label></td>
                                                <td class="nature-cell"><label><input type="radio" name="natureEnemy"
                                                                        value="serious">まじめ</label></td>
                                        </tr>
                                </table>
                        </div>

                </div>
        </main>

        <script>
                // 定数の定義
                const INDIVIDUAL_VALUE = 31; // 個体値
                const MAX_TOTAL_EV = 510;    // 努力値の最大合計値

                // ステータスキーの一覧
                const STAT_KEYS = ['hp', 'attack', 'block', 'contact', 'defence', 'speed'];
                const NON_HP_STATS = [
                        { id: 'attack', modKey: 'attack' },
                        { id: 'block', modKey: 'block' },
                        { id: 'contact', modKey: 'contact' },
                        { id: 'defence', modKey: 'defence' },
                        { id: 'speed', modKey: 'speed' }
                ];

                // ポケモンのデータベース
                const pokemonDatabase = {
                        "ガブリアス": { h: 108, a: 130, b: 95, c: 80, d: 85, s: 102 },
                        "ハバタクカミ": { h: 55, a: 55, b: 55, c: 135, d: 135, s: 135 },
                        "カイリュー": { h: 91, a: 134, b: 95, c: 100, d: 100, s: 80 },
                        "サーフゴー": { h: 87, a: 60, b: 95, c: 133, d: 91, s: 84 },
                        "パオジアン": { h: 80, a: 120, b: 80, c: 90, d: 65, s: 135 },
                        "ベコドン": { "h": 90, "a": 70, "b": 120, "c": 100, "d": 80, "s": 40 }
                };

                // 性格補正テーブル
                const natureTable = {
                        lonely: { up: 'attack', down: 'block' },
                        adamant: { up: 'attack', down: 'contact' },
                        naughty: { up: 'attack', down: 'defence' },
                        brave: { up: 'attack', down: 'speed' },
                        bold: { up: 'block', down: 'attack' },
                        impish: { up: 'block', down: 'contact' },
                        lax: { up: 'block', down: 'defence' },
                        relaxed: { up: 'block', down: 'speed' },
                        modest: { up: 'contact', down: 'attack' },
                        mild: { up: 'contact', down: 'block' },
                        rash: { up: 'contact', down: 'defence' },
                        quiet: { up: 'contact', down: 'speed' },
                        calm: { up: 'defence', down: 'attack' },
                        gentle: { up: 'defence', down: 'block' },
                        careful: { up: 'defence', down: 'contact' },
                        sassy: { up: 'defence', down: 'speed' },
                        timid: { up: 'speed', down: 'attack' },
                        hasty: { up: 'speed', down: 'block' },
                        jolly: { up: 'speed', down: 'contact' },
                        naive: { up: 'speed', down: 'defence' }
                };

                // 各サイドの設定情報（IDの接頭辞・接尾辞の定義）
                const SIDE_CONFIG = {
                        player: {
                                prefix: '', suffix: '', nameId: 'pokemonName', totalEvId: 'totalEV', natureName: 'naturePlayer'
                        },
                        enemy: {
                                prefix: 'enemy', suffix: '', nameId: 'enemyPokemonName', totalEvId: 'enemyTotalEV', natureName: 'natureEnemy'
                        }
                };

                // 種族データの読み込み
                const loadSpeciesData = (side) => {
                        const config = SIDE_CONFIG[side];
                        const name = document.getElementById(config.nameId).value;
                        const data = pokemonDatabase[name];

                        if (data) {
                                const statsMap = {
                                        hp: data.h,
                                        attack: data.a,
                                        block: data.b,
                                        contact: data.c,
                                        defence: data.d,
                                        speed: data.s
                                };

                                // 大文字小文字のルールに則って各要素を更新
                                for (const [key, value] of Object.entries(statsMap)) {
                                        const baseId = formatId(config.prefix, key, 'Num');
                                        const rangeId = formatId(config.prefix, key, 'Range');
                                        document.getElementById(baseId).value = value;
                                        document.getElementById(rangeId).value = value;
                                }

                                calculateStats(side);
                        }
                };

                // IDの命名規則を統一するヘルパー（例: enemy + hp + Num = enemyHpNum）
                const formatId = (prefix, key, suffix) => {
                        if (!prefix) return `${key}${suffix}`;
                        const capitalizedKey = key.charAt(0).toUpperCase() + key.slice(1);
                        return `${prefix}${capitalizedKey}${suffix}`;
                };

                // 入力値の同期
                const syncValue = (side, tarId, value) => {
                        document.getElementById(tarId).value = value;
                        calculateTotalEV(side);
                        calculateStats(side);
                };

                // 努力値合計の計算
                const calculateTotalEV = (side) => {
                        const config = SIDE_CONFIG[side];
                        const total = STAT_KEYS.reduce((sum, key) => {
                                const id = formatId(config.prefix, key, 'EVNum');
                                const val = Number(document.getElementById(id).value);
                                return sum + val;
                        }, 0);

                        const display = document.getElementById(config.totalEvId);
                        display.innerText = total;

                        if (total > MAX_TOTAL_EV) {
                                display.style.color = 'red';
                                display.style.fontWeight = 'bold';
                        } else {
                                display.style.color = 'black';
                                display.style.fontWeight = 'normal';
                        }
                };

                // 性格補正倍率の取得
                const getNatureMods = (nature) => {
                        const mods = { attack: 1.0, block: 1.0, contact: 1.0, defence: 1.0, speed: 1.0 };
                        const config = natureTable[nature];

                        if (config) {
                                mods[config.up] = 1.1;
                                mods[config.down] = 0.9;
                        }
                        return mods;
                };

                // 実数値の計算（指定されたサイドのみ）
                const calculateStats = (side) => {
                        const config = SIDE_CONFIG[side];
                        const levelId = formatId(config.prefix, 'level', 'Num');
                        const level = Number(document.getElementById(levelId).value);

                        const nature = document.querySelector(`input[name="${config.natureName}"]:checked`)?.value || 'hardy';
                        const natureMods = getNatureMods(nature);

                        // HPの計算
                        const hBaseId = formatId(config.prefix, 'hp', 'Num');
                        const hEVId = formatId(config.prefix, 'hp', 'EVNum');
                        const hStatId = formatId(config.prefix, 'hp', 'Stat');

                        const hBase = Number(document.getElementById(hBaseId).value);
                        const hEV = Number(document.getElementById(hEVId).value);
                        const hStat = Math.floor((hBase * 2 + INDIVIDUAL_VALUE + Math.floor(hEV / 4)) * level / 100) + level + 10;
                        document.getElementById(hStatId).innerText = hStat;

                        // HP以外の計算
                        NON_HP_STATS.forEach(s => {
                                const baseId = formatId(config.prefix, s.id, 'Num');
                                const evId = formatId(config.prefix, s.id, 'EVNum');
                                const statId = formatId(config.prefix, s.id, 'Stat');

                                const base = Number(document.getElementById(baseId).value);
                                const ev = Number(document.getElementById(evId).value);
                                const mod = natureMods[s.modKey];

                                const result = Math.floor((Math.floor((base * 2 + INDIVIDUAL_VALUE + Math.floor(ev / 4)) * level / 100) + 5) * mod);

                                const statDisplay = document.getElementById(statId);
                                statDisplay.innerText = result;

                                // スタイル補正の適用
                                if (mod > 1.0) {
                                        statDisplay.style.color = 'red';
                                        statDisplay.style.fontWeight = 'bold';
                                } else if (mod < 1.0) {
                                        statDisplay.style.color = 'blue';
                                        statDisplay.style.fontWeight = 'bold';
                                } else {
                                        statDisplay.style.color = 'black';
                                        statDisplay.style.fontWeight = 'normal';
                                }
                        });
                };

                // 両方のサイドを初期化・計算する
                const calculateAll = () => {
                        calculateStats('player');
                        calculateStats('enemy');
                };

                // イベントリスナーの設定
                document.querySelectorAll('input[name="naturePlayer"]').forEach(radio => {
                        radio.addEventListener('change', () => calculateStats('player'));
                });
                document.querySelectorAll('input[name="natureEnemy"]').forEach(radio => {
                        radio.addEventListener('change', () => calculateStats('enemy'));
                });

                // 初期表示
                window.onload = calculateAll;
        </script>

</body>
